[metadata]
name = "cheat"
description = "A channel to view cheatsheets"
requirements = ["bat", "cha", "fd"]

[source]
command = "fd -t f . ~/.config/cheatsheets"
display = "{replace:s/.*cheatsheets.//}"

[preview]
command = "cha '{}'"

[keybindings]
enter = "actions:print"

[actions.print]
description = "Print the selected cheatsheet"
command = "bat --color=always -l bash -pp '{}'"
mode = "execute"

