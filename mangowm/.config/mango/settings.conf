# Borders
border_px=3
no_border_when_single=1
# Background color of the root window
root_color=0x181f2bff
# Drop shadow when dragging windows
drop_color=0x17192588
# Inactive window border
border_color=0x242757ff
# Active window border
focus_color=0x9b98ffff
maximized_screen_color=0x89aa61ff
# Urgent window border (alerts)
urgent_color=0xbd2c40ff
scratchpad_color=0x90619eff
global_color=0xb153a7ff
overlay_color=0x14a57cff

group_bar_decorate_fg_color=0xc5c8c6ff
group_bar_decorate_bg_color=0x181f2bff
group_bar_decorate_focus_fg_color=0xc5c8c6ff
group_bar_decorate_focus_bg_color=0x0242757ff
group_bar_decorate_border_width=3
group_bar_decorate_font_desc=JetBrainsMono Nerd Font 14

tab_bar_decorate_fg_color=0xc5c8c6ff
tab_bar_decorate_bg_color=0x181f2bff
tab_bar_decorate_focus_fg_color=0xc5c8c6ff
tab_bar_decorate_focus_bg_color=0x0242757ff
tab_bar_decorate_font_desc=JetBrainsMono Nerd Font 14
tab_bar_decorate_border_width=3

# Disable window names in overcircle mode
title_message_bar_height=0

title_message_bar_decorate_focus_fg_color=0xc5c8c6ff
title_message_bar_decorate_focus_bg_color=0x181f2bff
title_message_bar_decorate_border_color=0x9b98ffff
title_message_bar_decorate_border_width=3

monocle_no_border=1
monocle_tab_mode=1

# Animation Configuration
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide
tag_animation_direction=1

# Master-Stack Layout Setting
default_master_factor=0.50
smart_gaps=1

# Gaps
gap_outer_horizontal=0
gap_outer_vertical=0

# Overview Setting
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=5

# Misc
focus_on_activate=0
drag_tile_to_tile=1
drag_tile_small=1
axis_bind_apply_timeout=0
warp_cursor=0
view_current_to_back=1

# Perfomance
#allow_tearing=2

# Enable drm_syncobj timeline support (helps with gaming stutter/lag)
sync_obj_enable=1

# keyboard
xkb_rules_layout=us,ru
xkb_rules_options=grp:win_space_toggle
bind=SUPER,x,spawn,s6 live start fcitx mozc
bind=SUPER+SHIFT,x,spawn,s6 live stop fcitx mozc

