# Let fullscreen, floating and layer-shell top windows share one layer so they can cover each other
float_full_to_top=1

# Window rules
window_rule=app_id:.*,allow_csd:0
window_rule=app_id:org.telegram.desktop.*,title:Media viewer,is_fullscreen:1,is_floating:1,animation_type_open:none,animation_type_close:none
window_rule=app_id:mpv,is_floating:1
window_rule=app_id:com.gabm.satty,is_floating:1
window_rule=app_id:firefox,title:Picture-in-Picture,is_floating:1,is_global:1
window_rule=app_id:virt-manager,tags:7,is_open_silent:1
window_rule=app_id:jetbrains-idea-ce,tags:4,is_open_silent:1
window_rule=app_id:steam,title:Steam,tags:9,is_open_silent:1
window_rule=app_id:steam,title:Friends List,tags:9,is_floating:1,is_open_silent:1
window_rule=app_id:steam,title:Special Offers,tags:9,is_floating:1,is_open_silent:1
window_rule=app_id:dragon-drop,is_floating:1,is_global:1

# Close window
bind=SUPER,q,killclient

# Master-stack layout
bind=SUPER,minus,incnmaster,-1
bind=SUPER,equal,incnmaster,+1

# Scroller layout
bind=SUPER+ALT,k,scroller_stack,up
bind=SUPER+ALT,j,scroller_stack,down
bind=SUPER+ALT,h,scroller_stack,left
bind=SUPER+ALT,l,scroller_stack,right

# Switch window focus
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right

# Swap windows
bind=SUPER,Return,zoom
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# Move window
bind=SUPER,c,centerwin
bind=SUPER,Up,movewin,+0,-50
bind=SUPER,Down,movewin,+0,+50
bind=SUPER,Left,movewin,-50,+0
bind=SUPER,Right,movewin,+50,+0

# Resize window
bind=SUPER+SHIFT,Up,resizewin,+0,-50
bind=SUPER+SHIFT,Down,resizewin,+0,+50
bind=SUPER+SHIFT,Left,resizewin,-50,+0
bind=SUPER+SHIFT,Right,resizewin,+50,+0

# Mouse Button Bindings
# NONE mode key only work in ov mode
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER+SHIFT,btn_left,moveresize,curresize
mousebind=SUPER,btn_right,moveresize,curresize

# Switch window status
bind=SUPER,Tab,overcircle
bind=SUPER,f,togglefloating
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,a,togglemaximizescreen
bind=SUPER,o,toggleoverlay
bind=SUPER,g,toggleglobal
bind=SUPER,i,minimized
bind=SUPER+SHIFT,I,restore_minimized,1

